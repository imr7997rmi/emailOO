name: Mod universal macOS build

# Every push (including pushes made from GitHub Desktop) builds a universal
# macOS app and replaces the ZIP attached to the rolling pre-release
# "build-<branch>". The release asset stays available for download.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    name: Build and publish universal app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          key: mod-macos-universal

      - name: Determine app variant
        id: variant
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            NYX|VORA) variant="$BRANCH" ;;
            mejoras|main) variant="" ;;
            *) variant="$(printf '%s' "$BRANCH" | tr '/' '-' | tr '[:lower:]' '[:upper:]')" ;;
          esac
          echo "value=$variant" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAILOO_VARIANT: ${{ steps.variant.outputs.value }}
          EMAILOO_CI: "1"
          EMAILOO_BRANCH: ${{ github.ref_name }}
          EMAILOO_BUILD_DIR: ${{ runner.temp }}/emailOO-builds
          EMAILOO_PUBLISH: "1"
          FLECTAR_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.FLECTAR_GOOGLE_DESKTOP_CLIENT_ID }}
          FLECTAR_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.FLECTAR_GOOGLE_DESKTOP_CLIENT_SECRET }}
          FLECTAR_MICROSOFT_DESKTOP_CLIENT_ID: ${{ secrets.FLECTAR_MICROSOFT_DESKTOP_CLIENT_ID }}
        run: scripts/mod-build-universal-macos.sh release
