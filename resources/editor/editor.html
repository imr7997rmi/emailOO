<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- emailOO compose editor: Squire (MIT) + DOMPurify (Apache-2.0/MPL-2.0).
     Remote resources are blocked; only inline and data: content loads. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: cid:; style-src 'unsafe-inline'; font-src data:; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: __BG__; color: __FG__; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #editor { min-height: 100%; padding: 12px 4px 40px 4px; box-sizing: border-box; outline: none; word-wrap: break-word; }
  #editor blockquote.emailoo-quote { margin: 8px 0 0 0; padding: 0; border: 0; }
  #editor blockquote { margin: 0 0 0 0.8ex; border-left: 2px solid __LINE__; padding-left: 1ex; }
  #editor a { color: __LINK__; }
  #editor img { max-width: 100%; height: auto; }
  .emailoo-header { color: __MUTED__; margin-top: 16px; }
  #linkbar { display: none; position: sticky; top: 0; z-index: 1; padding: 6px 4px; background: __BG__; border-bottom: 1px solid __LINE__; }
  #aimenu { display: none; position: fixed; top: 4px; z-index: 10; min-width: 220px; max-height: calc(100% - 16px); overflow-y: auto; padding: 4px; background: __BG__; border: 1px solid __LINE__; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); }
  .ai-item { padding: 6px 10px; border-radius: 6px; cursor: default; white-space: nowrap; }
  .ai-item:hover { background: __LINE__; }
  #aistatus { display: none; position: fixed; top: 6px; z-index: 11; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 6px 12px; border-radius: 999px; background: __BG__; border: 1px solid __LINE__; box-shadow: 0 4px 16px rgba(0,0,0,0.2); color: __MUTED__; font-size: 12px; }
  #aistatus.error { color: #e5534b; border-color: #e5534b; border-radius: 10px; }
  #aistatus .spin { width: 12px; height: 12px; flex: none; border: 2px solid __LINE__; border-top-color: __LINK__; border-radius: 50%; animation: spin 0.8s linear infinite; }
  #aistatus.error .spin { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #linkinput { flex: 1; font: inherit; color: __FG__; background: transparent; border: 1px solid __LINE__; border-radius: 6px; padding: 4px 8px; outline: none; }
</style>
<script>__DOMPURIFY__</script>
<script>__SQUIRE__</script>
</head>
<body>
<div id="linkbar"><input id="linkinput" type="url" spellcheck="false"></div>
<div id="aimenu"></div>
<div id="aistatus"><span class="spin"></span><span id="aistatustext"></span></div>
<div id="editor"></div>
<script>
(function () {
  "use strict";
  var root = document.getElementById("editor");
  var editor = new Squire(root, {
    blockTag: "DIV",
    sanitizeToDOMFragment: function (html) {
      return DOMPurify.sanitize(html, {
        WHOLE_DOCUMENT: false,
        RETURN_DOM_FRAGMENT: true,
        FORBID_TAGS: ["script", "style", "iframe", "object", "embed", "form", "input", "button", "meta", "link", "base"],
        FORBID_ATTR: ["srcset"],
        ALLOW_UNKNOWN_PROTOCOLS: false
      });
    }
  });
  // Small inline URL bar: WKWebView has no window.prompt here.
  function askLink() {
    var saved = editor.getSelection();
    var bar = document.getElementById("linkbar");
    var input = document.getElementById("linkinput");
    bar.style.display = "flex";
    input.value = "https://";
    input.focus();
    input.select();
    input.onkeydown = function (event) {
      if (event.key === "Enter" || event.key === "Escape") {
        event.preventDefault();
        bar.style.display = "none";
        editor.setSelection(saved);
        if (event.key === "Enter" && input.value && input.value !== "https://") {
          editor.makeLink(input.value);
        }
        editor.focus();
      }
    };
  }
  function post(kind, value) {
    try { window.ipc.postMessage(JSON.stringify({ kind: kind, value: value })); } catch (e) {}
  }
  // AI: the preset menu is drawn here because native views cover Slint
  // popups. Selection → replaced; no selection → the whole text is sent and
  // the answer replaces the reply above the quoted original.
  var aiMenu = document.getElementById("aimenu");
  var aiTarget = null;
  function hideAiMenu() { aiMenu.style.display = "none"; }
  var aiStatus = document.getElementById("aistatus");
  var aiStatusText = document.getElementById("aistatustext");
  var aiStatusTimer = null;
  var aiLeft = 4;
  function showStatus(text, isError) {
    clearTimeout(aiStatusTimer);
    aiStatusText.textContent = text;
    aiStatus.className = isError ? "error" : "";
    aiStatus.style.left = aiLeft + "px";
    aiStatus.style.display = "flex";
    if (isError) { aiStatusTimer = setTimeout(function () { aiStatus.style.display = "none"; }, 8000); }
  }
  // Cmd+K: add or edit a link, as in most mail apps.
  editor.setKeyHandler("Meta-k", function (_, event) { event.preventDefault(); askLink(); });
  // The pointer is over the editor: Slint does not see it leave its own
  // buttons, so their tooltips would stay on screen.
  var lastPointer = 0;
  document.addEventListener("mousemove", function () {
    var now = Date.now();
    if (now - lastPointer > 400) { lastPointer = now; post("pointer", ""); }
  });
  // The last selection the user made in the editor. Clicking the AI button
  // (outside the web view) takes focus away and can clear the live one.
  var lastRange = null;
  function snapshot() {
    var live = window.getSelection();
    if (live.rangeCount && root.contains(live.anchorNode)) {
      lastRange = live.getRangeAt(0).cloneRange();
    }
  }
  root.addEventListener("mouseup", snapshot);
  root.addEventListener("keyup", snapshot);
  var aiText = "";
  function captureForAi() {
    if (lastRange && !lastRange.collapsed && root.contains(lastRange.commonAncestorContainer)) {
      editor.setSelection(lastRange);
      aiTarget = lastRange.cloneRange();
      aiText = editor.getSelectedText();
    } else {
      aiTarget = null;
      aiText = root.innerText;
    }
  }
  function runAi(index) {
    post("ai", { preset: index, text: aiText });
  }
  document.addEventListener("mousedown", function (event) {
    if (aiMenu.style.display !== "none" && !aiMenu.contains(event.target)) { hideAiMenu(); }
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") { hideAiMenu(); }
  });
  window.emailoo = {
    setHTML: function (html) {
      editor.setHTML(html);
      // Caret at the very top, above the quoted original.
      var range = document.createRange();
      range.setStart(root.firstChild || root, 0);
      range.collapse(true);
      editor.setSelection(range);
      editor.focus();
    },
    getHTML: function () { return editor.getHTML(); },
    getText: function () { return root.innerText; },
    cmd: function (name) {
      switch (name) {
        case "bold": editor.hasFormat("B") ? editor.removeBold() : editor.bold(); break;
        case "italic": editor.hasFormat("I") ? editor.removeItalic() : editor.italic(); break;
        case "underline": editor.hasFormat("U") ? editor.removeUnderline() : editor.underline(); break;
        case "strike": editor.hasFormat("S") ? editor.removeStrikethrough() : editor.strikethrough(); break;
        case "bullet": editor.hasFormat("UL") ? editor.removeList() : editor.makeUnorderedList(); break;
        case "number": editor.hasFormat("OL") ? editor.removeList() : editor.makeOrderedList(); break;
        case "quote": editor.increaseQuoteLevel(); break;
        case "unquote": editor.decreaseQuoteLevel(); break;
        case "link": askLink(); return;
        case "undo": editor.undo(); break;
        case "redo": editor.redo(); break;
      }
      editor.focus();
    },
    selectedText: function () { return editor.getSelectedText(); },
    replaceSelection: function (text) { editor.insertPlainText(text, false); },
    showAiMenu: function (names, left) {
      captureForAi();
      aiMenu.innerHTML = "";
      names.forEach(function (name, index) {
        var item = document.createElement("div");
        item.className = "ai-item";
        item.textContent = name;
        // mousedown + preventDefault keeps the text selection.
        item.addEventListener("mousedown", function (event) {
          event.preventDefault();
          hideAiMenu();
          runAi(index);
        });
        aiMenu.appendChild(item);
      });
      aiLeft = Math.max(4, left);
      aiMenu.style.left = aiLeft + "px";
      aiMenu.style.display = names.length ? "block" : "none";
    },
    aiBusy: function (text) { showStatus(text, false); },
    requestSend: function () { post("send", { html: editor.getHTML(), text: root.innerText }); },
    aiError: function (text) { showStatus(text, true); },
    aiApply: function (text) {
      clearTimeout(aiStatusTimer);
      aiStatus.style.display = "none";
      if (aiTarget) {
        editor.setSelection(aiTarget);
      } else {
        var range = document.createRange();
        var header = root.querySelector(".emailoo-header");
        range.setStart(root, 0);
        if (header && header.parentNode === root) { range.setEndBefore(header); }
        else { range.setEnd(root, root.childNodes.length); }
        editor.setSelection(range);
        text = text + "\n\n";
      }
      aiTarget = null;
      editor.insertPlainText(text, false);
      editor.focus();
    }
  };
  editor.addEventListener("input", function () { post("changed", ""); });
  window.emailoo.setHTML(__INITIAL__);
  post("ready", "");
})();
</script>
</body>
</html>
